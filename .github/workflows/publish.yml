name: Build and publish extension repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/build-index.py
      - .github/scripts/merge-indexes.py
      - .github/scripts/security-scan.py
      - .github/workflows/publish.yml
      - build.gradle.kts
      - gradle/**
      - settings.gradle.kts
      - src/en/ehentai/**

permissions: {}

concurrency:
  group: extension-repository
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: ehentai
            title: E-Hentai
            module: :src:en:ehentai
            source-dir: src/en/ehentai
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files
        run: python .github/scripts/security-scan.py

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing SIGNING_KEY repository secret"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks

      - name: Build and lint ${{ matrix.title }}
        env:
          ALIAS: eextensions
          KEY_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$KEY_STORE_PASSWORD" || { echo "Missing SIGNING_PASSWORD repository secret"; exit 1; }
          ./gradlew "${{ matrix.module }}:assembleRelease" "${{ matrix.module }}:lintRelease" --no-daemon

      - name: Prepare repository files
        shell: bash
        run: |
          INFO="${{ matrix.source-dir }}/build/keiyoushi-source-info.json"
          APK=$(find "${{ matrix.source-dir }}/build/outputs/apk/release" -name '*.apk' -print -quit)
          JAR=$(find "${{ matrix.source-dir }}/build/outputs/jar/release" -name '*.jar' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -print | sort -V | tail -1)
          VERSION=$(python -c "import json; print(json.load(open('$INFO'))['versionName'])")
          CERT_OUTPUT=$($APKSIGNER verify --print-certs "$APK")
          CERT=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "${#CERT}" -eq 64 || { printf '%s\n' "$CERT_OUTPUT"; echo "Unable to extract APK signing certificate digest"; exit 1; }
          TAG="${{ matrix.slug }}-v$VERSION"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${{ matrix.source-dir }}/res/mipmap-xhdpi/ic_launcher.png"
          python .github/scripts/build-index.py \
            --source-info "$INFO" \
            --apk "$APK" \
            --jar "$JAR" \
            --signing-key "$CERT" \
            --apk-base-url "$RELEASE_BASE" \
            --jar-base-url "$RELEASE_BASE" \
            --icon-url "$ICON_URL" \
            --output release-bundle/repo-output
          cp "$APK" "$JAR" release-bundle/
          printf '%s\n' "$TAG" > release-bundle/tag.txt
          printf '%s\n' "${{ matrix.title }}" > release-bundle/title.txt
          (cd release-bundle && find . -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt)

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-release-${{ matrix.slug }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository for publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: extension-release-*
          path: release-bundles

      - name: Verify release bundles
        shell: bash
        run: |
          for bundle in release-bundles/extension-release-*; do
            (cd "$bundle" && sha256sum -c sha256sums.txt)
          done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for bundle in release-bundles/extension-release-*; do
            TAG=$(cat "$bundle/tag.txt")
            TITLE=$(cat "$bundle/title.txt")
            APK=$(find "$bundle" -maxdepth 1 -name '*.apk' -print -quit)
            JAR=$(find "$bundle" -maxdepth 1 -name '*.jar' -print -quit)
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" "$JAR" --clobber
            else
              gh release create "$TAG" "$APK" "$JAR" --title "$TITLE $TAG" --notes "Automated extension release from $GITHUB_SHA"
            fi
          done

      - name: Merge extension repository
        run: python .github/scripts/merge-indexes.py --bundles release-bundles --output repo-output

      - name: Publish repo branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin repo >/dev/null 2>&1; then
            git fetch origin repo:repo
            git switch repo
            git rm -rf .
          else
            git switch --orphan repo
            git rm -rf . || true
          fi
          cp -R repo-output/. .
          git add index.json index.min.json checksums.json apk jar
          git diff --cached --quiet || git commit -m "Publish extension repository from $GITHUB_SHA"
          git push origin HEAD:repo
